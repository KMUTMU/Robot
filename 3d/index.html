<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>범블비 3D 변신 설계 모델</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f0f1e; color:#fff; font-family:'Segoe UI',sans-serif; overflow:hidden; }
  #info {
    position:fixed; top:0; left:0; right:0; padding:12px 16px;
    background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);
    z-index:10; pointer-events:none;
  }
  #info h1 { color:#ffd700; font-size:1.1rem; }
  #info p { color:#aaa; font-size:.8rem; margin-top:2px; }
  #controls {
    position:fixed; bottom:0; left:0; right:0; padding:16px;
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    background:linear-gradient(0deg,rgba(0,0,0,.8),transparent); z-index:10;
  }
  button {
    background:linear-gradient(135deg,#ffd700,#e0a800); color:#1a1a1a;
    border:none; padding:12px 24px; font-size:1rem; font-weight:700;
    border-radius:30px; cursor:pointer; box-shadow:0 4px 14px rgba(255,215,0,.4);
  }
  button:active { transform:scale(.95); }
  .mode { background:rgba(255,255,255,.1); color:#ffd700; }
  #label { position:fixed; bottom:72px; left:0; right:0; text-align:center;
    color:#ffd700; font-weight:700; z-index:10; font-size:.95rem; }
  #hint { position:fixed; top:58px; left:0; right:0; text-align:center;
    color:#667; font-size:.75rem; z-index:10; }
</style>
</head>
<body>
  <div id="info">
    <h1>🤖 범블비 3D 변신 설계</h1>
    <p>마우스 드래그=회전 / 휠=확대 / 버튼=변신</p>
  </div>
  <div id="hint">👆 화면을 드래그해서 360° 돌려보세요</div>
  <div id="label">🚗 자동차 모드</div>
  <div id="controls">
    <button id="btnTransform">⚡ 변신!</button>
    <button id="btnServo" class="mode">🔧 서보 위치 보기</button>
  </div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== 씬 기본 =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f1e);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(6, 4, 8);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

// ===== 조명 =====
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 1);
dir.position.set(5, 10, 7);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0x6688ff, 0.4);
dir2.position.set(-5, 3, -5);
scene.add(dir2);

// ===== 바닥 그리드 =====
const grid = new THREE.GridHelper(20, 20, 0x334, 0x223);
grid.position.y = -0.01;
scene.add(grid);

// ===== 재질 =====
const yellow = new THREE.MeshStandardMaterial({ color:0xffcc00, metalness:0.4, roughness:0.4 });
const dark   = new THREE.MeshStandardMaterial({ color:0x222222, metalness:0.5, roughness:0.5 });
const glass  = new THREE.MeshStandardMaterial({ color:0x2a6ff0, metalness:0.3, roughness:0.1, transparent:true, opacity:0.7 });
const tire   = new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.8 });
const eyeMat = new THREE.MeshStandardMaterial({ color:0x36d1ff, emissive:0x36d1ff, emissiveIntensity:1 });
const servoMat = new THREE.MeshStandardMaterial({ color:0xff3355, emissive:0xff3355, emissiveIntensity:0.5, transparent:true, opacity:0.9 });

function box(w,h,d,mat){ return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); }

// ===== 로봇 전체 그룹 =====
const bot = new THREE.Group();
scene.add(bot);

// --- 몸통(차체) : 변신해도 중심 ---
const torso = box(2.4, 1.2, 1.4, yellow);
torso.position.y = 1;
bot.add(torso);

// 앞유리(차 지붕) = 머리가 됨
const headPivot = new THREE.Group();   // 회전축
headPivot.position.set(0, 1.6, 0);
bot.add(headPivot);
const head = box(0.9, 0.7, 0.9, glass);
head.position.y = 0.1;
headPivot.add(head);
// 눈 (로봇일 때 보임)
const eyeL = box(0.12,0.12,0.05, eyeMat); eyeL.position.set(-0.22, 0.15, 0.46);
const eyeR = box(0.12,0.12,0.05, eyeMat); eyeR.position.set( 0.22, 0.15, 0.46);
head.add(eyeL, eyeR);

// --- 왼팔 (차 왼쪽 옆면) ---
const armLPivot = new THREE.Group();
armLPivot.position.set(-1.2, 1.4, 0);
bot.add(armLPivot);
const armL = box(0.4, 1.6, 0.5, yellow);
armL.position.y = -0.7;
armLPivot.add(armL);

// --- 오른팔 ---
const armRPivot = new THREE.Group();
armRPivot.position.set(1.2, 1.4, 0);
bot.add(armRPivot);
const armR = box(0.4, 1.6, 0.5, yellow);
armR.position.y = -0.7;
armRPivot.add(armR);

// --- 왼다리 (차체 밑판 앞) ---
const legLPivot = new THREE.Group();
legLPivot.position.set(-0.55, 0.4, 0);
bot.add(legLPivot);
const legL = box(0.5, 1.6, 0.6, dark);
legL.position.y = -0.8;
legLPivot.add(legL);

// --- 오른다리 ---
const legRPivot = new THREE.Group();
legRPivot.position.set(0.55, 0.4, 0);
bot.add(legRPivot);
const legR = box(0.5, 1.6, 0.6, dark);
legR.position.y = -0.8;
legRPivot.add(legR);

// --- 바퀴 4개 (로봇일 때 다리 뒤로) ---
function wheel(){ const w = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.3,20), tire); w.rotation.z = Math.PI/2; return w; }
const wFL = wheel(), wFR = wheel(), wRL = wheel(), wRR = wheel();
bot.add(wFL, wFR, wRL, wRR);

// --- 서보 위치 표시 (빨간 큐브) ---
const servos = new THREE.Group();
servos.visible = false;
bot.add(servos);
function servoMarker(x,y,z,label){
  const m = box(0.3,0.3,0.3, servoMat);
  m.position.set(x,y,z);
  servos.add(m);
}
servoMarker(0, 1.6, 0);      // 서보1 머리
servoMarker(-1.2, 1.4, 0);   // 서보2 왼팔
servoMarker(1.2, 1.4, 0);    // 서보3 오른팔
servoMarker(-0.55, 0.4, 0);  // 서보4 왼다리
servoMarker(0.55, 0.4, 0);   // 서보5 오른다리

// ===== 두 가지 모드의 "목표 자세" =====
const CAR = {
  botY: 0,
  headRot: 0,   headY: -0.9,
  armLRot: 0,   armRRot: 0,     // 팔 접힘 (옆면)
  armLX: -1.0,  armRX: 1.0,
  legLRot: Math.PI/2, legRRot: Math.PI/2,  // 다리 접힘(수평)
  wheelY: 0.4, wheelSpread: 1.3, wheelZ: 0.9,
  torsoRotX: Math.PI/2*0.0
};
const ROBOT = {
  botY: 0.8,
  headRot: 0,  headY: 0.1,
  armLRot: 0.25, armRRot: -0.25,   // 팔 내려서 펼침
  armLX: -1.2, armRX: 1.2,
  legLRot: 0, legRRot: 0,          // 다리 섬(수직)
  wheelY: 0.4, wheelSpread: 0.55, wheelZ: -0.4,
  torsoRotX: 0
};

let t = 0;          // 0=자동차, 1=로봇
let target = 0;
let showServo = false;

function lerp(a,b,x){ return a + (b-a)*x; }

function applyPose(k){
  // k: 0~1 보간
  bot.position.y = lerp(CAR.botY, ROBOT.botY, k);

  // 머리: 회전하며 올라옴 (회전 = 역동성!)
  headPivot.rotation.x = lerp(0, 0, k);
  headPivot.rotation.y = lerp(0, Math.PI*2, k);  // 한 바퀴 돌며 등장
  head.position.y = lerp(CAR.headY, ROBOT.headY, k);

  // 팔
  armLPivot.rotation.z = lerp(0, ROBOT.armLRot, k);
  armRPivot.rotation.z = lerp(0, ROBOT.armRRot, k);
  armLPivot.position.x = lerp(CAR.armLX, ROBOT.armLX, k);
  armRPivot.position.x = lerp(CAR.armRX, ROBOT.armRX, k);

  // 다리 (수평->수직)
  legLPivot.rotation.x = lerp(CAR.legLRot, ROBOT.legLRot, k);
  legRPivot.rotation.x = lerp(CAR.legRRot, ROBOT.legRRot, k);

  // 바퀴 위치 (차 밑 -> 다리 뒤로)
  const spread = lerp(CAR.wheelSpread, ROBOT.wheelSpread, k);
  const wz = lerp(CAR.wheelZ, ROBOT.wheelZ, k);
  const wy = lerp(0.4, 0.5, k);
  wFL.position.set(-spread, wy, wz+0.6);
  wFR.position.set( spread, wy, wz+0.6);
  wRL.position.set(-spread, wy, wz-0.2);
  wRR.position.set( spread, wy, wz-0.2);
  const wspin = k * Math.PI*4;
  [wFL,wFR,wRL,wRR].forEach(w=>{ w.rotation.z = Math.PI/2; w.rotation.x = wspin; });

  // 눈은 로봇일 때만
  eyeMat.emissiveIntensity = k;
}

applyPose(0);

// ===== 버튼 =====
const label = document.getElementById('label');
document.getElementById('btnTransform').addEventListener('click', ()=>{
  target = target === 0 ? 1 : 0;
});
document.getElementById('btnServo').addEventListener('click', ()=>{
  showServo = !showServo;
  servos.visible = showServo;
});

// ===== 애니메이션 루프 =====
function animate(){
  requestAnimationFrame(animate);
  // t가 target으로 부드럽게 (역동적 easing)
  t += (target - t) * 0.06;
  applyPose(Math.max(0, Math.min(1, t)));

  label.textContent = t > 0.5 ? '🤖 로봇 모드' : '🚗 자동차 모드';

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
