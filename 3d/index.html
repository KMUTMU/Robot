<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>범블비 3D 변신 설계 (현실 구현형)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f0f1e; color:#fff; font-family:'Segoe UI',sans-serif; overflow:hidden; }
  #info { position:fixed; top:0; left:0; right:0; padding:12px 16px;
    background:linear-gradient(180deg,rgba(0,0,0,.75),transparent); z-index:10; pointer-events:none; }
  #info h1 { color:#ffd700; font-size:1.05rem; }
  #info p { color:#aaa; font-size:.78rem; margin-top:2px; }
  #controls { position:fixed; bottom:0; left:0; right:0; padding:14px;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    background:linear-gradient(0deg,rgba(0,0,0,.85),transparent); z-index:10; }
  button { background:linear-gradient(135deg,#ffd700,#e0a800); color:#1a1a1a;
    border:none; padding:11px 20px; font-size:.95rem; font-weight:700;
    border-radius:26px; cursor:pointer; box-shadow:0 4px 14px rgba(255,215,0,.35); }
  button:active { transform:scale(.95); }
  .mode { background:rgba(255,255,255,.12); color:#ffd700; }
  #label { position:fixed; bottom:66px; left:0; right:0; text-align:center;
    color:#ffd700; font-weight:700; z-index:10; font-size:.92rem; }
  #slider { position:fixed; bottom:108px; left:50%; transform:translateX(-50%);
    width:min(300px,80%); z-index:10; }
  #hint { position:fixed; top:56px; left:0; right:0; text-align:center;
    color:#667; font-size:.72rem; z-index:10; }
</style>
</head>
<body>
  <div id="info">
    <h1>🤖 범블비 3D 변신 설계 — 현실 구현형</h1>
    <p>모든 관절=경첩(한 축 회전) · 바퀴 네 모서리 · 서보 실제크기 반영</p>
  </div>
  <div id="hint">👆 드래그=회전 / 휠=확대 · 슬라이더로 변신 단계 조절</div>
  <input id="slider" type="range" min="0" max="100" value="0">
  <div id="label">🚗 자동차 모드</div>
  <div id="controls">
    <button id="btnTransform">⚡ 변신!</button>
    <button id="btnServo" class="mode">🔧 서보 표시</button>
    <button id="btnReset" class="mode">↺ 시점 리셋</button>
  </div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   단위: 1 three-unit = 1 cm (현실 치수 기준)
   목표 로봇 키 ≈ 18cm, 자동차 길이 ≈ 14cm
   서보 SG90 = 2.3 x 1.2 x 2.9 cm
   규칙:
     - 모든 관절은 Group(pivot) 하나의 축으로만 회전 (경첩)
     - 자식 부품은 pivot 기준으로만 배치 → 서로 뚫지 않음
     - 바퀴 4개는 차체 네 모서리 고정 (겹침 없음)
   ========================================================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0f1e);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
const camStart = new THREE.Vector3(26, 16, 30);
camera.position.copy(camStart);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 7, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const d1 = new THREE.DirectionalLight(0xffffff, 1.1); d1.position.set(12,22,14); scene.add(d1);
const d2 = new THREE.DirectionalLight(0x6688ff, 0.4); d2.position.set(-12,6,-10); scene.add(d2);

const grid = new THREE.GridHelper(60, 30, 0x334, 0x223); scene.add(grid);

// 재질
const yellow = new THREE.MeshStandardMaterial({color:0xffcc00, metalness:0.3, roughness:0.5});
const yellow2= new THREE.MeshStandardMaterial({color:0xe0a800, metalness:0.3, roughness:0.5});
const dark   = new THREE.MeshStandardMaterial({color:0x2a2a2a, metalness:0.4, roughness:0.6});
const glass  = new THREE.MeshStandardMaterial({color:0x2a6ff0, metalness:0.2, roughness:0.1, transparent:true, opacity:0.75});
const tire   = new THREE.MeshStandardMaterial({color:0x141414, roughness:0.85});
const rim    = new THREE.MeshStandardMaterial({color:0x888, metalness:0.8, roughness:0.3});
const eyeMat = new THREE.MeshStandardMaterial({color:0x36d1ff, emissive:0x36d1ff, emissiveIntensity:1});
const servoMat=new THREE.MeshStandardMaterial({color:0xff3355, emissive:0xff2244, emissiveIntensity:0.6, transparent:true, opacity:0.92});

function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); return m; }
function lerp(a,b,x){ return a+(b-a)*x; }
function clamp01(x){ return Math.max(0,Math.min(1,x)); }
// 단계별 easing: 구간 [s,e] 안에서 0→1
function phase(k,s,e){ return clamp01((k-s)/(e-s)); }
function easeInOut(x){ return x<0.5 ? 2*x*x : 1-Math.pow(-2*x+2,2)/2; }

// ===== 루트 (바닥에 발 닿게 전체를 올림) =====
const root = new THREE.Group();
scene.add(root);

// --- 몸통(차체 중앙): 변신해도 중심. 자동차때 눕고 로봇때 섬 ---
const bodyPivot = new THREE.Group();   // 상체 기울기(차체 → 로봇 몸통)
root.add(bodyPivot);

const torso = box(7, 3, 5, yellow);     // 폭7 높이3 깊이5 cm
bodyPivot.add(torso);
// 가슴 유리 디테일
const chest = box(4, 1.6, 0.4, glass); chest.position.set(0, 0.3, 2.5); torso.add(chest);

// --- 머리: 몸통 위 경첩. 자동차때 앞으로 눕고(보닛), 로봇때 세워짐 ---
const headPivot = new THREE.Group();
headPivot.position.set(0, 1.5, 1.2);       // 몸통 상단 앞쪽
torso.add(headPivot);
const head = box(2.4, 2.2, 2.2, yellow2);
head.position.set(0, 1.1, 0);              // pivot 위로
headPivot.add(head);
const visor = box(1.8, 0.5, 0.2, glass); visor.position.set(0, 1.3, 1.1); head.add(visor);
const eyeL = box(0.35,0.3,0.1,eyeMat); eyeL.position.set(-0.45,1.3,1.11); head.add(eyeL);
const eyeR = box(0.35,0.3,0.1,eyeMat); eyeR.position.set( 0.45,1.3,1.11); head.add(eyeR);

// --- 어깨+팔: 몸통 양옆 경첩. 자동차때 몸통옆에 붙어눕고, 로봇때 아래로 내려옴 ---
function buildArm(side){ // side: -1 왼, +1 오
  const shoulder = new THREE.Group();        // 어깨 관절 (서보)
  shoulder.position.set(side*3.6, 1.0, 0);
  torso.add(shoulder);
  const upper = box(1.4, 4, 1.6, yellow2);   // 윗팔
  upper.position.set(0, -2, 0);              // pivot 아래로 뻗음
  shoulder.add(upper);
  const elbow = new THREE.Group();           // 팔꿈치 관절
  elbow.position.set(0, -4, 0);
  shoulder.add(elbow);
  const fore = box(1.2, 3, 1.3, dark);       // 아랫팔
  fore.position.set(0, -1.5, 0);
  elbow.add(fore);
  const hand = box(1.1,1.1,1.1, yellow); hand.position.set(0,-3.1,0); elbow.add(hand);
  return { shoulder, elbow };
}
const armL = buildArm(-1);
const armR = buildArm(1);

// --- 다리: 차체 아래 경첩. 자동차때 앞뒤로 접혀 눕고, 로봇때 수직으로 섬 ---
function buildLeg(side){
  const hip = new THREE.Group();             // 고관절 (서보)
  hip.position.set(side*1.8, -1.5, 0);       // 몸통 하단
  torso.add(hip);
  const thigh = box(1.8, 4, 2, dark);        // 허벅지
  thigh.position.set(0, -2, 0);
  hip.add(thigh);
  const knee = new THREE.Group();            // 무릎 관절
  knee.position.set(0, -4, 0);
  hip.add(knee);
  const shin = box(1.7, 4, 1.9, yellow2);    // 정강이
  shin.position.set(0, -2, 0);
  knee.add(shin);
  const foot = box(2.2, 1, 3.4, dark);       // 발
  foot.position.set(0, -4.3, 0.6);
  knee.add(foot);
  return { hip, knee, shin, foot };
}
const legL = buildLeg(-1);
const legR = buildLeg(1);

// --- 바퀴 4개: 차체 네 모서리. 로봇때는 정강이 바깥쪽에 붙어 숨음 ---
function buildWheel(){
  const g = new THREE.Group();
  const t = new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,1.0,24), tire);
  t.rotation.z = Math.PI/2; g.add(t);
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,1.05,16), rim);
  r.rotation.z = Math.PI/2; g.add(r);
  root.add(g);
  return g;
}
const wheels = [buildWheel(), buildWheel(), buildWheel(), buildWheel()]; // FL,FR,RL,RR

// --- 서보 마커 (실제 SG90 크기 2.3x1.2x2.9) ---
const servoGroup = new THREE.Group(); servoGroup.visible=false; root.add(servoGroup);
function servoAt(parent){
  const s = box(2.3,2.9,1.2, servoMat);
  parent.add(s); servoGroup.add(s);  // 그룹에도 등록해 토글
  return s;
}
// 관절마다 서보 (경첩 축에 위치)
const sv = [
  servoAt(headPivot),      // 1 머리
  servoAt(armL.shoulder),  // 2 왼어깨
  servoAt(armR.shoulder),  // 3 오른어깨
  servoAt(legL.hip),       // 4 왼고관절
  servoAt(legR.hip),       // 5 오른고관절
  servoAt(legL.knee),      // 6 왼무릎 (선택)
  servoAt(legR.knee),      // 7 오른무릎 (선택)
];
// 서보 표시 토글용: visible은 servoGroup으로 제어하되, 각 메쉬를 그룹 소속으로
sv.forEach(s=>{ s.visible = true; });
function setServoVisible(v){ servoGroup.visible = v; sv.forEach(s=> s.visible=v); }
setServoVisible(false);

/* =========================================================
   포즈 정의 — k: 0(자동차) → 1(로봇)
   각 관절을 "단계별(phase)"로 움직여 충돌 없이 변신
   ========================================================= */
function applyPose(kRaw){
  const k = kRaw;

  // --- 단계 나누기 (순차 변신) ---
  const pStand = easeInOut(phase(k, 0.00, 0.35)); // 1) 몸통 세우기 + 다리 내리기
  const pLeg   = easeInOut(phase(k, 0.20, 0.55)); // 2) 무릎 펴기(섬)
  const pArm   = easeInOut(phase(k, 0.45, 0.80)); // 3) 팔 내려 펼치기
  const pHead  = easeInOut(phase(k, 0.70, 1.00)); // 4) 머리 세우기
  const pWheel = easeInOut(phase(k, 0.30, 0.70)); // 바퀴 이동

  // --- 몸통: 자동차때 수평(앞으로 90° 누움) → 로봇때 수직 ---
  // 차체는 길게 누운 상태 = X축 -90°, 로봇은 0°
  bodyPivot.rotation.x = lerp(-Math.PI/2, 0, pStand);
  // 전체 높이: 자동차 낮게, 로봇 서면 높게 (발이 바닥 y=0 닿도록 root를 올림)
  root.position.y = lerp(1.6, 10.2, pStand);

  // --- 다리 (고관절): 자동차때 몸통과 나란히 접힘 → 로봇때 수직 아래 ---
  // 자동차: 허벅지가 몸통 방향(눕힘)으로 +90°, 로봇: 0°(아래로)
  legL.hip.rotation.x = lerp(Math.PI/2, 0, pStand);
  legR.hip.rotation.x = lerp(Math.PI/2, 0, pStand);
  // 무릎: 자동차때 접힘(-150°) → 로봇때 펴짐(-10°)
  legL.knee.rotation.x = lerp(-2.6, -0.15, pLeg);
  legR.knee.rotation.x = lerp(-2.6, -0.15, pLeg);

  // --- 팔 (어깨): 자동차때 몸통 옆에 수평으로 눕고(앞으로) → 로봇때 아래로 ---
  // 어깨 X회전: 자동차 +90°(앞으로 뻗어 차 옆면처럼), 로봇 0°(아래)
  armL.shoulder.rotation.x = lerp(Math.PI/2, 0, pArm);
  armR.shoulder.rotation.x = lerp(Math.PI/2, 0, pArm);
  // 어깨 Z 살짝 벌림 (로봇 실루엣)
  armL.shoulder.rotation.z = lerp(0,  0.12, pArm);
  armR.shoulder.rotation.z = lerp(0, -0.12, pArm);
  // 팔꿈치 약간 굽힘
  armL.elbow.rotation.x = lerp(0, -0.2, pArm);
  armR.elbow.rotation.x = lerp(0, -0.2, pArm);

  // --- 머리: 자동차때 앞으로 눕힘(보닛) → 로봇때 세움 ---
  headPivot.rotation.x = lerp(-Math.PI/2*0.9, 0, pHead);
  eyeMat.emissiveIntensity = pHead;

  // --- 바퀴 4개 ---
  // 자동차 모드: 차체(누운 몸통) 네 모서리, 바닥 근처
  // 로봇 모드: 정강이 바깥쪽에 붙어 "숨음"
  // world 좌표로 직접 배치(보간)
  const carY = 1.6, carZf = 4.5, carZr = -4.5, carX = 4.2;
  // 로봇때 정강이 바깥 위치 (대략)
  const robY = 4.5, robZ = 0, robX = 3.2;
  const wy = lerp(carY, robY, pWheel);
  const wx = lerp(carX, robX, pWheel);
  const wzf= lerp(carZf, robZ, pWheel);
  const wzr= lerp(carZr, robZ, pWheel);
  // FL, FR, RL, RR  (왼-, 오+)
  wheels[0].position.set(-wx, wy, wzf);
  wheels[1].position.set( wx, wy, wzf);
  wheels[2].position.set(-wx, wy, wzr);
  wheels[3].position.set( wx, wy, wzr);
  // 로봇 모드에선 뒷바퀴 2개를 앞바퀴에 모으되 Z만 다르게(겹침 방지: 앞뒤로 약간)
  if(pWheel>0.01){
    wheels[2].position.z = lerp(carZr, -1.6, pWheel);
    wheels[3].position.z = lerp(carZr, -1.6, pWheel);
    wheels[0].position.z = lerp(carZf,  1.6, pWheel);
    wheels[1].position.z = lerp(carZf,  1.6, pWheel);
  }
  const spin = kRaw*Math.PI*3;
  wheels.forEach(w=>{ w.rotation.x = spin; });
}

applyPose(0);

// ===== UI =====
const label = document.getElementById('label');
const slider = document.getElementById('slider');
let t=0, target=0, showServo=false;

document.getElementById('btnTransform').addEventListener('click', ()=>{ target = target<0.5?1:0; });
document.getElementById('btnServo').addEventListener('click', ()=>{ showServo=!showServo; setServoVisible(showServo); });
document.getElementById('btnReset').addEventListener('click', ()=>{ camera.position.copy(camStart); controls.target.set(0,7,0); });
slider.addEventListener('input', e=>{ target = e.target.value/100; t = target; });

function animate(){
  requestAnimationFrame(animate);
  t += (target - t)*0.05;
  applyPose(clamp01(t));
  slider.value = Math.round(clamp01(t)*100);
  label.textContent = t>0.5 ? '🤖 로봇 모드' : '🚗 자동차 모드';
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
