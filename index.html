<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>범블비 역동적 변신 데모</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(160deg,#1a1a2e,#0f0f1e);
    color:#fff; font-family:'Segoe UI',sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:20px;
  }
  h1 { color:#ffd700; margin-bottom:4px; font-size:1.5rem; }
  .sub { color:#aaa; font-size:.85rem; margin-bottom:16px; }

  .stage {
    width:420px; height:360px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,215,0,.2);
    border-radius:16px;
    position:relative; overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.5);
  }
  .ground {
    position:absolute; bottom:40px; left:0; right:0;
    height:2px; background:rgba(255,215,0,.25);
  }

  /* 로봇 전체 컨테이너 */
  #bot {
    position:absolute; left:50%; bottom:42px;
    transform:translateX(-50%);
    transition:bottom 1.2s cubic-bezier(.34,1.3,.64,1);
  }

  .part {
    position:absolute;
    background:linear-gradient(135deg,#ffd700,#e0a800);
    border:2px solid #2a2a2a; border-radius:6px;
    transition:all 1.1s cubic-bezier(.34,1.3,.64,1);
  }
  .dark { background:linear-gradient(135deg,#333,#111); }

  /* ===== 차 모드 기본 배치 ===== */
  /* 차체 (몸통이 될 부분) */
  #torso {
    width:140px; height:48px; left:-70px; bottom:0;
    border-radius:10px;
  }
  /* 차 지붕/앞유리 (머리가 될 부분) */
  #head {
    width:70px; height:34px; left:-35px; bottom:44px;
    border-radius:12px 12px 4px 4px;
  }
  /* 왼팔 (차 왼쪽 옆면) */
  #armL {
    width:58px; height:20px; left:-66px; bottom:16px;
    transform-origin:right center;
  }
  /* 오른팔 (차 오른쪽 옆면) */
  #armR {
    width:58px; height:20px; left:8px; bottom:16px;
    transform-origin:left center;
  }
  /* 왼다리 (차 밑 왼쪽) */
  #legL {
    width:26px; height:30px; left:-40px; bottom:-16px;
    transform-origin:top center;
  }
  /* 오른다리 */
  #legR {
    width:26px; height:30px; left:14px; bottom:-16px;
    transform-origin:top center;
  }
  /* 바퀴들 */
  .wheel {
    position:absolute; width:26px; height:26px;
    background:radial-gradient(circle,#555 40%,#111 42%);
    border:2px solid #000; border-radius:50%;
    transition:all 1.1s cubic-bezier(.34,1.3,.64,1);
  }
  #w1 { left:-56px; bottom:-10px; }
  #w2 { left:30px; bottom:-10px; }

  /* 눈 (로봇 머리에 나타남) */
  .eye {
    position:absolute; width:8px; height:8px; border-radius:50%;
    background:#36d1ff; top:10px; opacity:0;
    transition:opacity .5s; box-shadow:0 0 8px #36d1ff;
  }
  #head .eyeL { left:16px; }
  #head .eyeR { right:16px; }

  /* ===== 로봇 모드 (.robot 클래스) ===== */
  #bot.robot { bottom:70px; }

  .robot #torso {
    width:70px; height:80px; left:-35px; bottom:40px;
    border-radius:8px;
  }
  .robot #head {
    width:40px; height:40px; left:-20px; bottom:122px;
    border-radius:8px; transform:rotate(360deg); /* 회전하며 올라옴! */
  }
  .robot #head .eye { opacity:1; }

  .robot #armL {
    width:22px; height:70px; left:-56px; bottom:46px;
    transform:rotate(360deg); /* 팔이 돌면서 펴짐 */
  }
  .robot #armR {
    width:22px; height:70px; left:34px; bottom:46px;
    transform:rotate(-360deg);
  }
  .robot #legL {
    width:26px; height:62px; left:-30px; bottom:-20px;
    transform:rotate(0deg);
  }
  .robot #legR {
    width:26px; height:62px; left:4px; bottom:-20px;
    transform:rotate(0deg);
  }
  /* 바퀴는 다리 뒤/발로 숨음 + 회전 */
  .robot #w1 { left:-32px; bottom:-22px; transform:rotate(720deg); }
  .robot #w2 { left:8px; bottom:-22px; transform:rotate(720deg); }

  /* 단계별 딜레이로 "순차적" 느낌 */
  .robot #torso { transition-delay:0s; }
  .robot #legL, .robot #legR { transition-delay:.3s; }
  .robot #armL, .robot #armR { transition-delay:.7s; }
  .robot #w1, .robot #w2 { transition-delay:.9s; }
  .robot #head { transition-delay:1.1s; }

  .controls { margin-top:22px; display:flex; gap:12px; align-items:center; }
  button {
    background:linear-gradient(135deg,#ffd700,#e0a800);
    color:#1a1a1a; border:none; padding:12px 28px;
    font-size:1rem; font-weight:700; border-radius:30px;
    cursor:pointer; box-shadow:0 4px 14px rgba(255,215,0,.4);
    transition:transform .1s;
  }
  button:active { transform:scale(.95); }
  .mode-label { font-size:.9rem; color:#ffd700; min-width:90px; }

  .legend {
    margin-top:18px; font-size:.78rem; color:#999;
    max-width:420px; line-height:1.6; text-align:center;
  }
  .legend b { color:#ffd700; }
</style>
</head>
<body>
  <h1>🤖 범블비 역동적 변신 데모</h1>
  <div class="sub">자동차 ⇄ 로봇 / 순차 + 회전 변신 시각화</div>

  <div class="stage">
    <div class="ground"></div>
    <div id="bot">
      <div class="part dark" id="torso"></div>
      <div class="part" id="head">
        <span class="eye eyeL"></span>
        <span class="eye eyeR"></span>
      </div>
      <div class="part" id="armL"></div>
      <div class="part" id="armR"></div>
      <div class="part dark" id="legL"></div>
      <div class="part dark" id="legR"></div>
      <div class="wheel" id="w1"></div>
      <div class="wheel" id="w2"></div>
    </div>
  </div>

  <div class="controls">
    <button id="btn">⚡ 변신!</button>
    <span class="mode-label" id="label">🚗 자동차 모드</span>
  </div>

  <div class="legend">
    각 부품의 <b>이동·회전·타이밍 딜레이</b>가 바로
    서보모터 한 개씩이 맡는 동작이에요.<br>
    <b>순서대로(딜레이)</b> + <b>회전(rotate)</b> + <b>속도(transition)</b>
    이 3가지가 "역동적 변신"의 핵심이에요.
  </div>

<script>
  const bot = document.getElementById('bot');
  const btn = document.getElementById('btn');
  const label = document.getElementById('label');
  let isRobot = false;

  btn.addEventListener('click', () => {
    isRobot = !isRobot;
    bot.classList.toggle('robot', isRobot);
    label.textContent = isRobot ? '🤖 로봇 모드' : '🚗 자동차 모드';
    btn.textContent = isRobot ? '⚡ 원래대로' : '⚡ 변신!';
  });
</script>
</body>
</html>
